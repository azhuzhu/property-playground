spring:
  application:
    name: property-market-api
  cache:
    type: simple
server:
  port: 8080
market:
  dataset-path: ${DATASET_PATH:../../data/House Price Dataset.csv}
model:
  api-url: ${MODEL_API_URL:http://localhost:8000}
management:
  endpoints:
    web:
      exposure:
        include: health,info,caches
  endpoint:
    health:
      probes:
        enabled: true

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - run: pip install -r services/model-api/requirements-dev.txt
      - run: make lint
      - run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run build
        working-directory: portal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn test -B
        working-directory: services/market-api
      - run: podman build --format docker -f services/model-api/Dockerfile -t property-playground-model-api .

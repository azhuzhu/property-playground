[tool.pytest.ini_options]
testpaths = ["services/model-api/tests", "services/estimator-api/tests"]
pythonpath = [
    "contracts/generated/python",
    "services/model-api",
    "services/estimator-api",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pylint.main]
py-version = "3.12"
persistent = false

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
]
